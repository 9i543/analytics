<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECstore 電商網站改版影響分析報告</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 毛玻璃效果容器 */
        .glass-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        }

        /* 頂部導航 */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
        }

        .nav-tabs {
            display: flex;
            gap: 1rem;
        }

        .nav-tab {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .nav-tab:hover,
        .nav-tab.active {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* 主要內容區域 */
        .main-content {
            padding-top: 100px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .report-container {
            max-width: 1200px;
            width: 100%;
            padding: 2rem;
        }

        /* 報告標題 */
        .report-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .main-title {
            font-size: 3rem;
            font-weight: 300;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #ffffff, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 0.5rem;
        }

        .period {
            font-size: 1rem;
            opacity: 0.6;
            color: #ffa726;
        }

        /* 關鍵指標卡片 */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin: 3rem 0;
        }

        .metric-card {
            padding: 2rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .metric-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(255, 255, 255, 0.1);
        }

        .metric-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }

        .metric-title {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            opacity: 0.8;
        }

        .metric-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .positive {
            color: #4caf50;
        }

        .neutral {
            color: #ffa726;
        }

        .metric-description {
            font-size: 0.9rem;
            opacity: 0.7;
            line-height: 1.4;
        }

        /* 進度條 */
        .progress-bar {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 8px;
            margin: 1rem 0;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #ffa726, #ff9800);
            height: 100%;
            border-radius: 10px;
            transition: width 2s ease;
        }

        /* 核心結論區域 */
        .conclusion-section {
            margin-top: 4rem;
            padding: 2rem;
        }

        .conclusion-title {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            text-align: center;
            color: #ffa726;
        }

        .conclusion-text {
            font-size: 1.1rem;
            line-height: 1.6;
            text-align: center;
            opacity: 0.9;
        }

        /* 右側導航 */
        .side-nav {
            position: fixed;
            right: 2rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .nav-button {
            width: 12px;
            height: 12px;
            background: rgba(255, 255, 255, 0.3);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-button:hover,
        .nav-button.active {
            background: rgba(255, 255, 255, 0.8);
            transform: scale(1.2);
        }

        /* 頁腳 */
        .footer {
            position: fixed;
            bottom: 1rem;
            right: 2rem;
            font-size: 0.8rem;
            opacity: 0.6;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 0.2rem;
            opacity: 0.7;
        }

        .close-btn:hover {
            opacity: 1;
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }

            .nav-tabs {
                flex-wrap: wrap;
                justify-content: center;
            }

            .main-title {
                font-size: 2rem;
            }

            .metrics-grid {
                grid-template-columns: 1fr;
            }

            .side-nav {
                display: none;
            }

            .footer {
                position: relative;
                bottom: auto;
                right: auto;
                justify-content: center;
                margin-top: 2rem;
            }
        }

        /* 動畫效果 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .metric-card {
            animation: fadeInUp 0.6s ease forwards;
        }

        .metric-card:nth-child(1) { animation-delay: 0.1s; }
        .metric-card:nth-child(2) { animation-delay: 0.2s; }
        .metric-card:nth-child(3) { animation-delay: 0.3s; }
    </style>
</head>
<body>
    <!-- 頂部導航 -->
    <header class="header">
        <div class="header-content">
            <div class="logo">電商改版分析</div>
            <nav class="nav-tabs">
                <button class="nav-tab active" onclick="showSection('home')">首頁</button>
                <button class="nav-tab" onclick="showSection('summary')">執行摘要</button>
                <button class="nav-tab" onclick="showSection('analysis')">統計分析</button>
                <button class="nav-tab" onclick="showSection('timeline')">時間序列</button>
                <button class="nav-tab" onclick="showSection('confounders')">混淆因子</button>
                <button class="nav-tab" onclick="showSection('risk')">風險評估</button>
                <button class="nav-tab" onclick="showSection('insights')">商業洞察</button>
                <button class="nav-tab" onclick="showSection('recommendations')">行動建議</button>
                <button class="nav-tab" onclick="showSection('conclusion')">結論</button>
            </nav>
        </div>
    </header>

    <!-- 主要內容 -->
    <main class="main-content">
        <div class="report-container">
            <!-- 報告標題 -->
            <div class="report-header">
                <h1 class="main-title">ECstore 電商網站改版影響分析報告</h1>
                <p class="subtitle">考慮媒體流量來源因素的深度分析</p>
                <p class="period">2024年3月至2025年1月（48週數據）</p>
            </div>

            <!-- 關鍵指標 -->
            <div class="metrics-grid">
                <div class="metric-card glass-container">
                    <span class="metric-icon">📊</span>
                    <h3 class="metric-title">可信度評分</h3>
                    <div class="metric-value neutral">70%</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 70%"></div>
                    </div>
                    <p class="metric-description">基於統計方法和數據品質的整體可信度評估</p>
                </div>

                <div class="metric-card glass-container">
                    <span class="metric-icon">📈</span>
                    <h3 class="metric-title">整體改進效果</h3>
                    <div class="metric-value positive">+0.9%</div>
                    <div class="metric-description">轉換效率提升，具備統計顯著性（p &lt; 0.001）</div>
                </div>

                <div class="metric-card glass-container">
                    <span class="metric-icon">🔬</span>
                    <h3 class="metric-title">統計分析</h3>
                    <div class="metric-value neutral">增強版</div>
                    <div class="metric-description">採用進階統計方法確保結果的準確性和可靠性</div>
                </div>
            </div>

            <!-- 核心結論 -->
            <section class="conclusion-section glass-container">
                <h2 class="conclusion-title">核心結論</h2>
                <p class="conclusion-text">
                    報告顯示網站改版對整體產生正向影響，導致轉換效率提升約 <strong class="positive">0.9%</strong>，
                    且具備統計顯著性。但媒體管道表現變化主要反映策略調整過程而非純粹改版效果。
                </p>
            </section>
        </div>
    </main>

    <!-- 右側導航 -->
    <nav class="side-nav">
        <button class="nav-button active" title="首頁"></button>
        <button class="nav-button" title="執行摘要"></button>
        <button class="nav-button" title="統計分析"></button>
        <button class="nav-button" title="時間序列"></button>
        <button class="nav-button" title="混淆因子"></button>
        <button class="nav-button" title="風險評估"></button>
        <button class="nav-button" title="商業洞察"></button>
        <button class="nav-button" title="行動建議"></button>
        <button class="nav-button" title="結論"></button>
        <button class="nav-button" title="附錄"></button>
        <button class="nav-button" title="參考資料"></button>
    </nav>

    <!-- 頁腳 -->
    <footer class="footer">
        <span>Created by MiniMax Agent</span>
        <button class="close-btn" onclick="hideFooter()">×</button>
    </footer>

    <script>
        // 導航功能
        function showSection(section) {
            // 移除所有active類別
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // 添加active類別到當前按鈕
            event.target.classList.add('active');
            
            // 這裡可以添加實際的section切換邏輯
            console.log(`切換到: ${section}`);
        }

        // 隱藏頁腳
        function hideFooter() {
            document.querySelector('.footer').style.display = 'none';
        }

        // 右側導航按鈕功能
        document.querySelectorAll('.nav-button').forEach((button, index) => {
            button.addEventListener('click', function() {
                // 移除所有active類別
                document.querySelectorAll('.nav-button').forEach(btn => {
                    btn.classList.remove('active');
                });
                
                // 添加active類別到當前按鈕
                this.classList.add('active');
                
                // 對應頂部導航
                const sections = ['home', 'summary', 'analysis', 'timeline', 'confounders', 'risk', 'insights', 'recommendations', 'conclusion'];
                if (sections[index]) {
                    const tabs = document.querySelectorAll('.nav-tab');
                    tabs.forEach(tab => tab.classList.remove('active'));
                    tabs[index].classList.add('active');
                }
            });
        });

        // 頁面載入動畫
        document.addEventListener('DOMContentLoaded', function() {
            // 進度條動畫
            setTimeout(() => {
                document.querySelectorAll('.progress-fill').forEach(fill => {
                    fill.style.width = fill.style.width;
                });
            }, 500);
            
            // 卡片淡入動畫
            document.querySelectorAll('.metric-card').forEach((card, index) => {
                setTimeout(() => {
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, 300 + (index * 200));
            });
        });

        // 滾動效果
        window.addEventListener('scroll', function() {
            const scrolled = window.pageYOffset;
            const header = document.querySelector('.header');
            if (scrolled > 100) {
                header.style.background = 'rgba(26, 26, 46, 0.95)';
            } else {
                header.style.background = 'rgba(26, 26, 46, 0.9)';
            }
        });

        // 響應式導航處理
        function handleResponsiveNav() {
            const navTabs = document.querySelector('.nav-tabs');
            if (window.innerWidth <= 768) {
                // 在移動設備上處理導航
                console.log('移動設備導航');
            }
        }

        window.addEventListener('resize', handleResponsiveNav);
    </script>
</body>
</html>
