<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網頁 1 - Web1 測試頁面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .container {
            max-width: 800px;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #fff, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        
        .description {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            opacity: 0.8;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }
        
        .feature-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .feature-card h3 {
            color: #ffd700;
            margin-bottom: 0.5rem;
        }
        
        .navigation {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .nav-link {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            padding: 0.8rem 1.5rem;
            margin: 0 0.5rem;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }
        
        .nav-link:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .timestamp {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            background: rgba(0, 0, 0, 0.5);
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 歡迎來到 Web1</h1>
        <div class="subtitle">第一個測試網頁</div>
        
        <div class="description">
            這是您的第一個 GitHub Pages 網頁！這個網頁使用了現代化的設計風格，
            包含漸層背景、玻璃態效果和響應式布局。
        </div>
        
        <div class="features">
            <div class="feature-card">
                <h3>📱 響應式設計</h3>
                <p>自動適配各種螢幕尺寸</p>
            </div>
            <div class="feature-card">
                <h3>🎨 現代風格</h3>
                <p>使用玻璃態效果和漸層</p>
            </div>
            <div class="feature-card">
                <h3>⚡ 快速載入</h3>
                <p>純 HTML/CSS，無需額外依賴</p>
            </div>
        </div>
        
        <div class="navigation">
            <p>導航到其他頁面：</p>
            <a href="../web2/index.html" class="nav-link">前往 Web2</a>
            <a href="../web3/index.html" class="nav-link">前往 Web3</a>
            <a href="../" class="nav-link">返回主頁</a>
        </div>
    </div>
    
    <div class="timestamp">
        建立時間: 2025-10-29 | Web1
    </div>
</body>
</html>
